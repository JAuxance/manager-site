<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="background" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.56" stop-color="#080b15"/>
      <stop offset="1" stop-color="#1a2345"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#6785ff"/>
      <stop offset="1" stop-color="#9670ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="170%">
      <feDropShadow dx="-12" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#fff" stroke-opacity=".025"/>
    </pattern>
    <clipPath id="app-clip"><rect x="530" y="138" width="690" height="460" rx="18"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <g transform="translate(46 28)">
    <rect width="42" height="42" rx="12" fill="#0c111b" stroke="#fff" stroke-opacity=".16"/>
    <g transform="translate(9 9) scale(.024)">
      <rect x="288" y="272" width="72" height="480" fill="#f7f8ff"/>
      <rect x="416" y="272" width="72" height="480" fill="#f7f8ff"/>
      <rect x="544" y="272" width="72" height="480" fill="#f7f8ff"/>
      <rect x="672" y="272" width="72" height="480" fill="#f7f8ff"/>
      <line x1="232" y1="680" x2="792" y2="420" stroke="#f7f8ff" stroke-width="48"/>
    </g>
    <text x="55" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#f7f8ff">Manager</text>
  </g>

  <text x="48" y="177" font-family="Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2.2" fill="#9da8bb">LA PRODUCTIVITÉ DESKTOP, SANS LE BRUIT</text>
  <text x="47" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-3.5" fill="#f6f7fc">Ta journée.</text>
  <text x="47" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-3.5" fill="url(#accent)">Enfin claire.</text>
  <text x="48" y="389" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#a2adbf">Tâches, focus, planning et journal.</text>
  <text x="48" y="417" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#a2adbf">Une seule application desktop.</text>

  <g transform="translate(48 456)">
    <rect width="220" height="54" rx="13" fill="url(#accent)"/>
    <path d="M22 18.5 31 17.5v9.2h-9zm10.6-1.2 10.6-1.2v10.6H32.6zM22 28.3h9v9.2l-9-1zm10.6 0h10.6v10.6l-10.6-1.2z" fill="#fff"/>
    <text x="58" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">Télécharger pour PC</text>
  </g>
  <text x="48" y="548" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#758197">GRATUIT · WINDOWS 10/11 · LINUX</text>

  <g filter="url(#shadow)">
    <rect x="530" y="138" width="690" height="460" rx="18" fill="#090b10" stroke="#fff" stroke-opacity=".16"/>
    <rect x="530" y="138" width="690" height="38" rx="18" fill="#10141d"/>
    <rect x="530" y="158" width="690" height="18" fill="#10141d"/>
    <g clip-path="url(#app-clip)">
      <image href="/screenshots/dashboard.png" x="530" y="176" width="690" height="460" preserveAspectRatio="xMidYMin slice"/>
    </g>
  </g>
</svg>
